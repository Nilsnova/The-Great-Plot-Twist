<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#eee6cf"><link rel="icon" href="./favicon.svg"><title>The Great Plot Twist · Scene studies</title></head><body>
<main id="study" aria-label="Illustrated scene study"></main>
<header><div><p class="eyebrow">THE GREAT PLOT TWIST / COMPOSITION WORKSHOP</p><h1>Little worlds, taking shape.</h1></div><div class="links"><a href="./asset-library.html">All drawings ↗</a><a href="./">Play Lighthouse Isle ↗</a></div></header>
<nav id="destinations" aria-label="Choose a scene"></nav>
<aside class="caption"><p class="eyebrow" id="scene-number"></p><h2 id="scene-title"></h2><p id="scene-description"></p><span>Visual studies · staged artwork</span></aside>
